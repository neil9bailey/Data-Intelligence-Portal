version: 2026.05.18
last_reviewed: 2026-05-18
purpose: Configurable source catalogue for public-sector opportunity and customer intelligence.
source_metadata:
  checked_against:
    - name: Find a Tender API documentation
      url: https://www.find-tender.service.gov.uk/Developer/Documentation
    - name: Contracts Finder API documentation
      url: https://www.contractsfinder.service.gov.uk/apidocumentation
    - name: Public Contracts Scotland OCDS API help
      url: https://api.publiccontractsscotland.gov.uk/
    - name: Sell2Wales OCDS guide
      url: https://www.sell2wales.gov.wales/helpandresources/ocds/dataaccessinfo
    - name: TED API developer documentation
      url: https://docs.ted.europa.eu/api/latest/search.html
guardrails:
  approved_domains:
    - www.gov.uk
    - gov.uk
    - www.find-tender.service.gov.uk
    - find-tender.service.gov.uk
    - www.contractsfinder.service.gov.uk
    - contractsfinder.service.gov.uk
    - nationalhighways.co.uk
    - www.nationalhighways.co.uk
    - prod-upgrade.nationalhighways.co.uk
    - api.publiccontractsscotland.gov.uk
    - www.publiccontractsscotland.gov.uk
    - publiccontractsscotland.gov.uk
    - www.sell2wales.gov.wales
    - sell2wales.gov.wales
    - ted.europa.eu
    - docs.ted.europa.eu
    - op.europa.eu
source_types:
  - ocds_api
  - eforms_api
  - bulk_ocds
  - web_page
  - search_reference
  - commercial_aggregator
sources:
  - key: find_a_tender
    name: Find a Tender OCDS release package API
    source_family: official_notice
    source_type: ocds_api
    base_url: https://www.find-tender.service.gov.uk
    query_url: https://www.find-tender.service.gov.uk/api/1.0/ocdsReleasePackages?updatedFrom={updated_from}&updatedTo={updated_to}&stages=planning,tender&limit={limit}
    official: true
    active: true
    coverage: UK above-threshold public and utilities procurement notices
    auth_model: none
    data_format: REST OCDS JSON
    dedupe_strategy: ocid_release_or_notice_reference
    connector_status: live_mvp
    notes: Official UK high-value public procurement notice source.
  - key: contracts_finder
    name: Contracts Finder OCDS search API
    source_family: official_notice
    source_type: ocds_api
    base_url: https://www.contractsfinder.service.gov.uk
    query_url: https://www.contractsfinder.service.gov.uk/Published/Notices/OCDS/Search?publishedFrom={published_from}&publishedTo={published_to}&stages=planning,tender&limit={limit}
    official: true
    active: true
    coverage: UK below-threshold, future, live, early engagement and award notices
    auth_model: public reads
    data_format: REST OCDS JSON
    dedupe_strategy: ocid_or_notice_id
    connector_status: live_mvp
    notes: Official Contracts Finder opportunity source.
  - key: public_contracts_scotland
    name: Public Contracts Scotland OCDS API
    source_family: official_notice
    source_type: ocds_api
    base_url: https://api.publiccontractsscotland.gov.uk
    query_url: https://api.publiccontractsscotland.gov.uk/v1/Notices
    official: true
    active: false
    coverage: Scotland public-sector procurement notices
    auth_model: none
    data_format: REST OCDS JSON
    dedupe_strategy: ocid_or_notice_reference
    connector_status: disabled_requires_endpoint_validation
    notes: Official OCDS API endpoint is configured as a reference source. Keep disabled in the live demo until TLS/certificate validation and date-scoped retrieval behaviour are confirmed.
  - key: sell2wales
    name: Sell2Wales public procurement source
    source_family: official_notice
    source_type: bulk_ocds
    base_url: https://www.sell2wales.gov.wales
    query_url: https://www.sell2wales.gov.wales/helpandresources/ocds/dataaccessinfo
    official: true
    active: true
    coverage: Wales public-sector procurement notices
    auth_model: none for browsing; connector validation required
    data_format: Web/bulk/OCDS route to confirm
    dedupe_strategy: notice_reference_or_content_hash
    connector_status: live_public_source
    notes: Official OCDS guide confirms public reusable formats and API/bulk download route. Use source check for change tracking until date-scoped retrieval is configured.
  - key: ted_eforms
    name: TED eForms notice data
    source_family: official_notice
    source_type: eforms_api
    base_url: https://ted.europa.eu
    query_url: https://docs.ted.europa.eu/api/latest/search.html
    official: true
    active: true
    coverage: EU and Ireland procurement notices where relevant
    auth_model: public reads
    data_format: REST/eForms XML
    dedupe_strategy: notice_id_or_publication_reference
    connector_status: live_public_source
    notes: Official TED API developer documentation confirms Search API access. Use documentation/source change tracking until the eForms normaliser is productionised.
  - key: tenders_direct_backup
    name: Tenders Direct backup aggregator
    source_family: commercial_aggregator
    source_type: commercial_aggregator
    base_url: https://www.tendersdirect.co.uk
    query_url: https://www.tendersdirect.co.uk/
    official: false
    active: false
    coverage: Optional commercial belt-and-braces source where licensed by the customer.
    auth_model: commercial account required
    data_format: provider-specific
    dedupe_strategy: provider_reference_or_content_hash
    connector_status: disabled_requires_contract
    notes: Included as an inactive configuration placeholder only. Do not activate without provider terms, account approval and secret handling.
