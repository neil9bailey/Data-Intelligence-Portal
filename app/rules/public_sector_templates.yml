version: 2026.05.18
last_reviewed: 2026-05-18
purpose: Semi-configured organisation templates used by Intelligence Packs to reduce manual setup for UK public-sector customers.
guardrails:
  decision_support_only: true
  no_credentials_stored: true
  public_source_first: true
  human_review_required: true
  note: Templates create a useful starting configuration. Account teams must confirm customer facts, portal access, scope and commercial judgement.
