        document_retrieval_mode: account_required_manual
        account_reference: Account owner to confirm. Credentials must stay outside DIP.
        notes: Track portal ownership and retrieval tasks only. No automated portal login.
    connectors: []
    kra_queries:
      - agent: Official Source Scout
        query: Transport for London TfL passenger information ticketing operational technology cyber resilience asset management data platform
      - agent: Customer Memory Curator
        query: Transport for London supplier requirements procurement framework cyber data service management transport
    missing_actions:
      - Confirm TfL portal route and supplier account owner.
      - Confirm current framework and lot eligibility.
      - Review extracted notices before client-facing reports.

