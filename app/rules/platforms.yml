version: 2026.05.17
guardrails:
  no_credentials_in_mvp: true
  human_approval_required_before_portal_action: true
  portal_automation_default: manual_assisted
platforms:
  - key: procontract
    name: ProContract
    platform_type: buyer_portal
    login_model: supplier_account
    supported_actions:
      - portal registration status
      - document retrieval task
      - manual document capture
      - requirement extraction from human-provided text
    requires_credentials: true
    human_approval_required: true
    active: true
    connector_status: manual_assisted
    platform_domains: procontract.due-north.com; supplierlive.proactisp2p.com
    notes: Common UK public-sector procurement portal family.
  - key: intend
    name: In-Tend
    platform_type: buyer_portal
    login_model: supplier_account
    supported_actions:
      - portal registration status
      - document retrieval task
      - manual document capture
      - requirement extraction from human-provided text
    requires_credentials: true
    human_approval_required: true
    active: true
    connector_status: manual_assisted
    platform_domains: in-tendhost.co.uk; in-tend.co.uk; in-tend.com
    notes: Platform family used by many buyer portals.
  - key: jaggaer
    name: Jaggaer
    platform_type: buyer_portal
    login_model: supplier_account
    supported_actions:
      - portal registration status
      - document retrieval task
      - manual document capture
    requires_credentials: true
    human_approval_required: true
    active: true
    connector_status: manual_assisted
    platform_domains: jaggaer.com; bravosolution.co.uk
    notes: Public-sector and central-government portal family.
  - key: delta_esourcing
    name: Delta eSourcing
    platform_type: buyer_portal
    login_model: supplier_account
    supported_actions:
      - portal registration status
      - document retrieval task
      - manual document capture
    requires_credentials: true
    human_approval_required: true
    active: true
    connector_status: manual_assisted
    platform_domains: delta-esourcing.com; delta-esourcing.co.uk
    notes: UK public-sector eSourcing portal family.
  - key: find_a_tender_api
    name: Find a Tender API
    platform_type: official_source_api
    login_model: public_api
    supported_actions:
      - public notice retrieval
      - metadata retrieval
      - detect changes
      - OCDS extraction
    requires_credentials: false
    human_approval_required: true
    active: true
    connector_status: public_api_no_key
    platform_domains: find-tender.service.gov.uk; www.find-tender.service.gov.uk
    notes: Official UK above-threshold notice source. Read-only public retrieval only.
  - key: contracts_finder_api
    name: Contracts Finder API
    platform_type: official_source_api
    login_model: public_api
    supported_actions:
      - public notice retrieval
      - metadata retrieval
      - detect changes
      - OCDS extraction
    requires_credentials: false
    human_approval_required: true
    active: true
    connector_status: public_api_no_key
    platform_domains: contractsfinder.service.gov.uk; www.contractsfinder.service.gov.uk
    notes: Official UK below-threshold, future opportunity and award notice source. Read-only public retrieval only.
  - key: public_contracts_scotland_api
    name: Public Contracts Scotland API
    platform_type: official_source_api
    login_model: public_api
    supported_actions:
      - public notice retrieval
      - metadata retrieval
      - detect changes
    requires_credentials: false
    human_approval_required: true
    active: true
    connector_status: public_api_no_key
    platform_domains: api.publiccontractsscotland.gov.uk; publiccontractsscotland.gov.uk; www.publiccontractsscotland.gov.uk
    notes: Official Scotland OCDS source. Date-scoped retrieval should be configured per watch profile.
  - key: sell2wales_ocds
    name: Sell2Wales OCDS
    platform_type: official_source_api
    login_model: public_bulk
    supported_actions:
      - public notice retrieval
      - bulk OCDS download
      - detect changes
    requires_credentials: false
    human_approval_required: true
    active: true
    connector_status: public_api_no_key
    platform_domains: sell2wales.gov.wales; www.sell2wales.gov.wales
    notes: Official Wales OCDS/open contracting source. Use only public reusable data routes.
  - key: ted_search_api
    name: TED Search API
    platform_type: official_source_api
    login_model: public_or_api_key
    supported_actions:
      - public notice search
      - eForms metadata retrieval
      - detect changes
    requires_credentials: false
    human_approval_required: true
    active: true
    connector_status: public_api_no_key
    platform_domains: ted.europa.eu; docs.ted.europa.eu; op.europa.eu
    notes: Official TED search/eForms route for EU horizon scanning. Submission or eSender actions are out of scope.
