version: 2026.05.17
guardrails:
  no_credentials_in_mvp: true
  human_approval_required_before_portal_action: true
  portal_automation_default: manual_assisted
platforms:
  - key: procontract
    name: ProContract
    platform_type: buyer_portal
    login_model: supplier_account
    supported_actions:
      - portal registration status
      - document retrieval task
      - manual document capture
      - requirement extraction from human-provided text
    requires_credentials: true
    human_approval_required: true
    active: true
    connector_status: manual_assisted
    platform_domains: procontract.due-north.com; supplierlive.proactisp2p.com
    notes: Common UK public-sector procurement portal family.
  - key: intend
    name: In-Tend
    platform_type: buyer_portal
    login_model: supplier_account
    supported_actions:
      - portal registration status
      - document retrieval task
      - manual document capture
      - requirement extraction from human-provided text
    requires_credentials: true
    human_approval_required: true
    active: true
    connector_status: manual_assisted
    platform_domains: in-tendhost.co.uk; in-tend.co.uk; in-tend.com
    notes: Platform family used by many buyer portals.
  - key: jaggaer
    name: Jaggaer
    platform_type: buyer_portal
    login_model: supplier_account
    supported_actions:
      - portal registration status
      - document retrieval task
      - manual document capture
    requires_credentials: true
    human_approval_required: true
    active: true
    connector_status: manual_assisted
    platform_domains: jaggaer.com; bravosolution.co.uk
    notes: Public-sector and central-government portal family.
  - key: delta_esourcing
    name: Delta eSourcing
    platform_type: buyer_portal
    login_model: supplier_account
    supported_actions:
      - portal registration status
      - document retrieval task
      - manual document capture
    requires_credentials: true
    human_approval_required: true
    active: true
    connector_status: manual_assisted
    platform_domains: delta-esourcing.com; delta-esourcing.co.uk
    notes: UK public-sector eSourcing portal family.
