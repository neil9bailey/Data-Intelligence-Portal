services:
  app:
    build: .
    ports:
      - "8091:8080"
    environment:
      - APP_NAME=${APP_NAME:-Contracted Opportunity Finder}
      - DIP_ENVIRONMENT_LABEL=${DIP_ENVIRONMENT_LABEL:-Live COF workspace}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/data-intelligence-portal.sqlite}
      - SQLITE_JOURNAL_MODE=${SQLITE_JOURNAL_MODE:-DELETE}
      - SQLITE_PERSISTENT_COPY_PATH=${SQLITE_PERSISTENT_COPY_PATH:-}
      - SEED_REFERENCE_DATA=${SEED_REFERENCE_DATA:-true}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
      - AUTO_APPLY_CUSTOMER_PACKS=${AUTO_APPLY_CUSTOMER_PACKS:-true}
      - KRA_LLM_PROVIDER=${KRA_LLM_PROVIDER:-disabled}
      - KRA_API_KEY=${KRA_API_KEY:-}
      - KRA_MODEL=${KRA_MODEL:-}
      - KRA_MCP_MODE=${KRA_MCP_MODE:-local_registry}
      - ENTRA_AUTH_ENABLED=${ENTRA_AUTH_ENABLED:-false}
      - LOCAL_ADMIN_MODE=${LOCAL_ADMIN_MODE:-true}
      - ENTRA_ADMIN_GROUP_ID=${ENTRA_ADMIN_GROUP_ID:-}
      - ENTRA_STANDARD_GROUP_ID=${ENTRA_STANDARD_GROUP_ID:-}
      - ENTRA_AUDITOR_GROUP_ID=${ENTRA_AUDITOR_GROUP_ID:-}
      - DIP_ACCESS_SCOPES_JSON=${DIP_ACCESS_SCOPES_JSON:-}
      - DIP_OUTBOX_DIR=${DIP_OUTBOX_DIR:-/app/data/outbox}
      - DIP_PUBLIC_DOMAIN=${DIP_PUBLIC_DOMAIN:-dip.vendorlogic.io}
      - DIP_REMOTE_HEALTH_URL=${DIP_REMOTE_HEALTH_URL:-https://dip.vendorlogic.io/healthz}
      - DIP_DEPLOYMENT_LABEL=${DIP_DEPLOYMENT_LABEL:-local-docker}
    volumes:
      - ./data:/app/data
